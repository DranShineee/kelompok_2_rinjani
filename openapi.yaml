openapi: 3.0.3

info:
  title: REST API Peralatan Sewa Rinjani (Equipments)
  description: >
    API Contract untuk mengelola inventaris alat sewa pendakian Gunung Rinjani
    pada Praktikum Interoperabilitas Pertemuan 6.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000
    description: Server Lokal Laravel (php artisan serve)

tags:
  - name: Equipments
    description: Operasi manajemen katalog dan stok alat sewa outdoor

paths:

  /api/equipments:

    get:
      tags:
        - Equipments
      summary: Mengambil seluruh katalog alat sewa
      description: Mengembalikan daftar seluruh peralatan sewa yang tersedia di database.
      operationId: getAllEquipments

      responses:

        '200':
          description: Data peralatan sewa berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentListResponse'

        '500':
          description: Terjadi kesalahan pada server backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    post:
      tags:
        - Equipments
      summary: Menambahkan peralatan sewa baru
      description: Menyimpan data satu unit perlengkapan outdoor baru ke database.
      operationId: createEquipment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
            example:
              name: "Tenda Dome 4P Kapasitas 4 Orang"
              category: "Tenda"
              daily_rental_rate: 60000
              total_stock: 12

      responses:

        '201':
          description: Peralatan sewa berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'

        '422':
          description: Data yang dikirim tidak valid atau gagal divalidasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

        '500':
          description: Terjadi kesalahan pada server backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/equipments/{id}:

    get:
      tags:
        - Equipments
      summary: Mengambil detail satu alat sewa berdasarkan ID
      description: Mengembalikan data rincian satu unit alat sewa sesuai parameter ID.
      operationId: getEquipmentById

      parameters:
        - name: id
          in: path
          description: ID unik alat sewa
          required: true
          schema:
            type: integer
            example: 1

      responses:

        '200':
          description: Detail peralatan ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'

        '404':
          description: Peralatan sewa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Terjadi kesalahan internal server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    put:
      tags:
        - Equipments
      summary: Memperbarui data peralatan sewa
      description: Mengubah data peralatan sewa secara keseluruhan berdasarkan ID.
      operationId: updateEquipment

      parameters:
        - name: id
          in: path
          description: ID peralatan yang akan diubah
          required: true
          schema:
            type: integer
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
            example:
              name: "Tenda Dome 4P Seri Pro"
              category: "Tenda"
              daily_rental_rate: 75000
              total_stock: 10

      responses:

        '200':
          description: Data peralatan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'

        '422':
          description: Validasi input data pembaruan gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

        '404':
          description: Peralatan sewa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Terjadi kesalahan internal server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


    delete:
      tags:
        - Equipments
      summary: Menghapus data alat sewa
      description: Menghapus catatan inventaris alat sewa berdasarkan ID.
      operationId: deleteEquipment

      parameters:
        - name: id
          in: path
          description: ID peralatan yang ingin dihapus
          required: true
          schema:
            type: integer
            example: 1

      responses:

        '200':
          description: Peralatan sewa berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

        '404':
          description: Peralatan sewa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Terjadi kesalahan internal server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  schemas:

    Equipment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Tenda Dome 4P Kapasitas 4 Orang"
        category:
          type: string
          example: "Tenda"
        daily_rental_rate:
          type: number
          format: float
          example: 60000.00
        total_stock:
          type: integer
          example: 12
        created_at:
          type: string
          format: date-time
          example: "2026-09-22T07:15:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-22T07:15:00.000000Z"

    EquipmentInput:
      type: object
      required:
        - name
        - category
        - daily_rental_rate
        - total_stock
      properties:
        name:
          type: string
          example: "Kompor Portable Ultralight"
        category:
          type: string
          example: "Alat Masak"
        daily_rental_rate:
          type: number
          example: 20000
        total_stock:
          type: integer
          example: 20

    EquipmentResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Operasi peralatan sewa berhasil dilakukan"
        data:
          $ref: '#/components/schemas/Equipment'

    EquipmentListResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Daftar peralatan sewa berhasil diambil"
        data:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'

    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Peralatan sewa berhasil dihapus"

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Validasi gagal"
        errors:
          type: object
          example:
            name:
              - "Kolom name wajib diisi."

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Peralatan sewa tidak ditemukan"